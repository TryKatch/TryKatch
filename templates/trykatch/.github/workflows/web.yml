name: web-ci

on:
  pull_request:
  push:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  verify-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: 10.0.3xx
      - uses: pnpm/action-setup@f520eceda224fe1a4aed5a2a27a194379a409996 # v6
        with:
          version: 10.17.1
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: dotnet restore Trykatch.slnx
      - run: dotnet build src/API/Trykatch.Api/Trykatch.Api.csproj -c Release --no-restore
      - run: pnpm --dir web install --frozen-lockfile
      - run: pnpm --dir web generate
      - run: pnpm --dir web generate:check
      - run: git diff --exit-code -- web/packages/api-client/openapi web/packages/api-client/src/generated docs/generated/assistant-contract.json
      - run: pnpm --dir web typecheck
      - run: pnpm --dir web test
      - run: pnpm --dir web build
      - run: pnpm --dir web --filter @trykatch/web exec playwright install --with-deps chromium
      - run: pnpm --dir web --filter @trykatch/web test:e2e
      - run: pnpm --dir web audit --audit-level high
      - run: docker build -f web/apps/web/Dockerfile .
