name: ci

on:
  pull_request:
  push:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: 10.0.3xx
      # Renamed lockfiles are created on first restore; do not enable a cache
      # that requires them before that first generated CI run.
      - run: dotnet tool restore
      - run: dotnet restore Trykatch.slnx
      - run: dotnet build Trykatch.slnx -c Release --no-restore
      - name: Validate full-stack module composition
        run: dotnet run --project tools/Trykatch.ModuleTool -c Release --no-build -- module doctor --root .
      - run: dotnet test tests/Trykatch.UnitTests -c Release --no-build
      - name: Enforce module architecture
        run: |
          dotnet test tests/Trykatch.ArchitectureTests -c Debug
          for project in tests/Modules/*/*Tests/*.csproj; do dotnet test "$project" -c Debug; done
      - run: dotnet test tests/Trykatch.IntegrationTests -c Release --no-build
      - name: Verify composite module packages
        run: bash scripts/test-module-packages.sh
      - name: Validate observability deployment contracts
        run: bash scripts/test-observability.sh
      - run: dotnet list Trykatch.slnx package --vulnerable --include-transitive
      - run: TRYKATCH_RELEASE_VERSION=ci-validation docker compose --env-file .env.example config --quiet
      - run: docker build -f src/API/Trykatch.Api/Dockerfile .
      - uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          path: .
          format: spdx-json
          output-file: trykatch.spdx.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: trykatch-sbom
          path: trykatch.spdx.json
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
