name: ci

on:
  pull_request:
  push:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: 11.0.1xx
      - name: Detect reference module composition
        id: starter-profile
        shell: bash
        run: |
          has_reference_modules=$(node -e 'const fs=require("node:fs"); const catalog=JSON.parse(fs.readFileSync("trykatch.modules.json","utf8")); const enabled=new Set(catalog.modules.filter(module => module.enabled).map(module => module.id)); console.log(enabled.has("projects") && enabled.has("documents") ? "true" : "false")')
          echo "has_reference_modules=$has_reference_modules" >> "$GITHUB_OUTPUT"
      # Renamed lockfiles are created on first restore; do not enable a cache
      # that requires them before that first generated CI run.
      - run: dotnet tool restore
      - run: dotnet restore Trykatch.slnx
      - run: dotnet build Trykatch.slnx -c Release --no-restore
      - name: Validate full-stack module composition
        run: dotnet run --project tools/Trykatch.ModuleTool -c Release --no-build -- module doctor --root .
      - run: dotnet test tests/Trykatch.UnitTests -c Release --no-build
      - name: Enforce architecture for the current composition
        run: dotnet test tests/Trykatch.ArchitectureTests -c Debug
      - name: Enforce reference module architecture
        if: steps.starter-profile.outputs.has_reference_modules == 'true'
        run: |
          for project in tests/Modules/*/*Tests/*.csproj; do dotnet test "$project" -c Debug; done
      - name: Verify full sample integration behavior
        if: steps.starter-profile.outputs.has_reference_modules == 'true'
        run: dotnet test tests/Trykatch.IntegrationTests -c Release --no-build
      - name: Verify minimal platform and migration behavior
        if: steps.starter-profile.outputs.has_reference_modules != 'true'
        run: >-
          dotnet test tests/Trykatch.IntegrationTests -c Release --no-build
          --filter "FullyQualifiedName~ProductionMigratorTests|FullyQualifiedName~PostgresRuntimeGrantAtomicityTests|FullyQualifiedName~ProductionIdentityContinuityTests|FullyQualifiedName~AuthenticationSecurityTests|FullyQualifiedName~OrganizationScopeMiddlewareTests"
      - name: Verify reference module suites against full sample composition
        if: steps.starter-profile.outputs.has_reference_modules != 'true'
        shell: bash
        run: |
          set -euo pipefail
          sample=$(mktemp -d "$RUNNER_TEMP/trykatch-full-sample.XXXXXX")
          trap 'rm -rf "$sample"' EXIT
          rsync -a --exclude '.git/' --exclude '**/bin/' --exclude '**/obj/' --exclude '**/node_modules/' ./ "$sample/"
          cd "$sample"
          dotnet run --project tools/Trykatch.ModuleTool -c Release -- module enable projects --root .
          dotnet run --project tools/Trykatch.ModuleTool -c Release -- module enable documents --root .
          dotnet restore Trykatch.slnx
          dotnet build Trykatch.slnx -c Release --no-restore
          dotnet test tests/Trykatch.ArchitectureTests -c Debug
          for project in tests/Modules/*/*Tests/*.csproj; do dotnet test "$project" -c Debug; done
          dotnet test tests/Trykatch.IntegrationTests -c Release --no-build
      - name: Verify composite module packages
        run: bash scripts/test-module-packages.sh
      - name: Validate observability deployment contracts
        run: bash scripts/test-observability.sh
      - run: dotnet list Trykatch.slnx package --vulnerable --include-transitive
      - run: TRYKATCH_RELEASE_VERSION=ci-validation docker compose --env-file .env.example config --quiet
      - run: docker build -f src/API/Trykatch.Api/Dockerfile .
      - uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          path: .
          format: spdx-json
          output-file: trykatch.spdx.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: trykatch-sbom
          path: trykatch.spdx.json
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
