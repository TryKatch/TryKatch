extensions:
  bearertokenauth/receiver:
    filename: /run/secrets/otel-token
  file_storage:
    directory: /var/lib/otelcol/storage
    create_directory: true
    max_size: 1073741824
    fsync: true
    compaction:
      on_start: true
      on_rebound: true
      directory: /var/lib/otelcol/compaction
      rebound_needed_threshold_mib: 100
      rebound_trigger_threshold_mib: 10

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
        tls:
          cert_file: /run/secrets/otel-server.crt
          key_file: /run/secrets/otel-server.key
        auth:
          authenticator: bearertokenauth/receiver
      http:
        endpoint: 0.0.0.0:4318
        tls:
          cert_file: /run/secrets/otel-server.crt
          key_file: /run/secrets/otel-server.key
        auth:
          authenticator: bearertokenauth/receiver

processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 384
    spike_limit_mib: 64
  transform/privacy:
    error_mode: propagate
    trace_statements:
      - context: resource
        statements:
          - keep_keys(resource.attributes, ["service.name", "service.namespace", "service.version", "service.instance.id", "deployment.environment.name"])
      - context: span
        statements:
          - set(span.status.message, "")
          - set(span.name, span.attributes["http.route"]) where span.attributes["http.route"] != nil
          - set(span.name, "database operation") where span.attributes["db.operation.name"] != nil
          - set(span.name, "messaging operation") where span.attributes["messaging.system"] != nil
          - set(span.name, "operation") where span.attributes["http.route"] == nil and span.attributes["db.operation.name"] == nil and span.attributes["messaging.system"] == nil
      - context: spanevent
        statements:
          - set(spanevent.name, "exception") where spanevent.name == "exception"
          - keep_keys(spanevent.attributes, ["exception.type"])
    log_statements:
      - context: resource
        statements:
          - keep_keys(resource.attributes, ["service.name", "service.namespace", "service.version", "service.instance.id", "deployment.environment.name"])
      - context: log
        statements:
          - set(log.body, "Application telemetry event")
    metric_statements:
      - context: resource
        statements:
          - keep_keys(resource.attributes, ["service.name", "service.namespace", "service.version", "service.instance.id", "deployment.environment.name"])
      - context: datapoint
        statements:
          - set(datapoint.attributes["service.name"], resource.attributes["service.name"])
          - set(datapoint.attributes["service.namespace"], resource.attributes["service.namespace"])
          - set(datapoint.attributes["deployment.environment.name"], resource.attributes["deployment.environment.name"])
  redaction/privacy:
    allow_all_keys: false
    allowed_keys: [event.name, event.id, exception.type, error.type, http.request.method, http.response.status_code, http.route, network.protocol.version, url.scheme, db.operation.name, db.namespace, server.address, server.port, messaging.system, messaging.operation.type, messaging.destination.name, messaging.message.id, outcome, RequestMethod, RouteTemplate, StatusCode, ElapsedMilliseconds, MessageId, MessageType, DeliveryAttempt, ExceptionType, service.name, service.namespace, deployment.environment.name]
    blocked_key_patterns: ["(?i).*(authorization|cookie|credential|password|secret|token|email|user|organization|baggage|query|statement).*"]
    blocked_values: ["(?i)bearer\\s+[a-z0-9._~+/-]+=*", "(?i)(password|secret|token)=[^&\\s]+", "[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\\.[A-Za-z]{2,}"]
    redact_all_types: true
    summary: silent
  batch:
    send_batch_size: 1024
    send_batch_max_size: 2048
    timeout: 5s

exporters:
  otlp_http/loki:
    endpoint: http://loki:3100/otlp
    timeout: 5s
    retry_on_failure: {enabled: true, initial_interval: 1s, max_interval: 30s, max_elapsed_time: 10m}
    sending_queue: {enabled: true, storage: file_storage, sizer: requests, queue_size: 2000, num_consumers: 4}
  otlp_http/tempo:
    endpoint: http://tempo:4318
    timeout: 5s
    retry_on_failure: {enabled: true, initial_interval: 1s, max_interval: 30s, max_elapsed_time: 10m}
    sending_queue: {enabled: true, storage: file_storage, sizer: requests, queue_size: 2000, num_consumers: 4}
  prometheus:
    endpoint: 0.0.0.0:8889
    resource_to_telemetry_conversion: {enabled: false}

service:
  extensions: [bearertokenauth/receiver, file_storage]
  telemetry:
    logs: {level: info}
    metrics:
      readers:
        - pull:
            exporter:
              prometheus: {host: 0.0.0.0, port: 8888, without_type_suffix: false}
  pipelines:
    logs: {receivers: [otlp], processors: [memory_limiter, transform/privacy, redaction/privacy, batch], exporters: [otlp_http/loki]}
    traces: {receivers: [otlp], processors: [memory_limiter, transform/privacy, redaction/privacy, batch], exporters: [otlp_http/tempo]}
    metrics: {receivers: [otlp], processors: [memory_limiter, transform/privacy, redaction/privacy, batch], exporters: [prometheus]}
