log_format proxy_test_safe '$request_method $status';

server {
  listen 8080;
  server_name _;
  access_log /dev/stdout proxy_test_safe;
  error_log /dev/null;

  location = /api/proxy-dns-contract {
    default_type text/plain;
    return 200 "$server_addr|$http_x_forwarded_for|$http_x_forwarded_proto|$request_uri\n";
  }

  location ~ ^/api/v1/auth/password/reset/dns-replay-probe/ {
    return 444;
  }

  location / {
    default_type text/plain;
    return 200 "$http_x_forwarded_for|$http_x_forwarded_proto\n";
  }
}
