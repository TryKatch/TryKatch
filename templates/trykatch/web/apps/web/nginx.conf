map $http_x_forwarded_proto $trykatch_forwarded_proto {
  default $scheme;
  "~*^https$" https;
}

map $http_x_forwarded_for $trykatch_forwarded_for {
  default $http_x_forwarded_for;
  "" $remote_addr;
}

server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  location = /healthz {
    access_log off;
    add_header Content-Type text/plain;
    return 200 "ok\n";
  }

  location ~ ^/(api|connect)/ {
    proxy_pass http://api:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $trykatch_forwarded_for;
    proxy_set_header X-Forwarded-Proto $trykatch_forwarded_proto;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
