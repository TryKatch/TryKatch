set_real_ip_from ${TRYKATCH_INGRESS_PROXY_IP};
real_ip_header X-Forwarded-For;
real_ip_recursive off;

geo $realip_remote_addr $trykatch_trusted_ingress {
  default 0;
  ${TRYKATCH_INGRESS_PROXY_IP} 1;
}

map "$trykatch_trusted_ingress:$http_x_forwarded_proto" $trykatch_forwarded_proto {
  default $scheme;
  "~^1:https$" https;
}

server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  location = /healthz {
    access_log off;
    add_header Content-Type text/plain;
    return 200 "ok\n";
  }

  location ~ ^/(api|connect)/ {
    proxy_pass http://api:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $trykatch_forwarded_proto;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
