set_real_ip_from ${TRYKATCH_INGRESS_PROXY_IP};
real_ip_header X-Forwarded-For;
real_ip_recursive off;

geo $realip_remote_addr $trykatch_trusted_ingress {
  default 0;
  ${TRYKATCH_INGRESS_PROXY_IP} 1;
}

map "$trykatch_trusted_ingress:$http_x_forwarded_proto" $trykatch_forwarded_proto {
  default $scheme;
  "~^1:https$" https;
}

map $uri $trykatch_route_label {
  default "spa";
  ~^/api/ "api";
  ~^/connect/ "identity";
}

log_format trykatch_safe escape=json '{"method":"$request_method","status":$status,"duration_seconds":$request_time,"route":"$trykatch_route_label"}';

resolver 127.0.0.11 valid=5s ipv6=off;
resolver_timeout 2s;

map $http_upgrade $trykatch_connection_upgrade {
  default upgrade;
  '' close;
}

upstream trykatch_api {
  zone trykatch_api 64k;
  # SignalR negotiation and its WebSocket upgrade must reach the same replica.
  ip_hash;
  server api:8080 resolve;
}

server {
  listen 8080;
  server_name _;
  access_log /dev/stdout trykatch_safe;
  # Nginx error messages cannot be field-redacted and may include the original
  # request target. Failures remain visible through the safe access log status.
  error_log /dev/null;
  root /usr/share/nginx/html;
  index index.html;

  location = /healthz {
    access_log off;
    add_header Content-Type text/plain;
    return 200 "ok\n";
  }

  location ~ ^/(api|connect)/ {
    proxy_pass http://trykatch_api;
    proxy_http_version 1.1;
    proxy_connect_timeout 1s;
    proxy_set_header Host $http_host;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $trykatch_connection_upgrade;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $trykatch_forwarded_proto;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
