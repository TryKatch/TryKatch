name: trykatch-app-slug

x-bounded-logging: &bounded-logging
  driver: json-file
  options: {max-size: "10m", max-file: "3"}

services:
  migrator:
    logging: *bounded-logging
    build:
      context: .
      dockerfile: src/API/Trykatch.Migrator/Dockerfile
    environment:
      ConnectionStrings__trykatchdb: ${TRYKATCH_MIGRATOR_CONNECTION}
      Database__OrganizationRuntimeRole: trykatch_org_runtime
      Database__PlatformRuntimeRole: trykatch_platform_runtime
      Database__IdentityRuntimeRole: trykatch_identity_runtime
      Database__OutboxWorkerRole: trykatch_outbox_worker
    depends_on:
      postgres:
        condition: service_healthy
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    restart: "no"
    deploy:
      resources:
        limits: { cpus: "1.0", memory: 512M }

  api:
    logging: *bounded-logging
    build:
      context: .
      dockerfile: src/API/Trykatch.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: ${TRYKATCH_ENVIRONMENT:-Production}
      ConnectionStrings__trykatch-organization: ${TRYKATCH_ORG_RUNTIME_CONNECTION}
      ConnectionStrings__trykatch-platform: ${TRYKATCH_PLATFORM_RUNTIME_CONNECTION}
      ConnectionStrings__trykatch-identity: ${TRYKATCH_IDENTITY_RUNTIME_CONNECTION}
      ConnectionStrings__trykatch-outbox: ${TRYKATCH_OUTBOX_WORKER_CONNECTION}
      Application__PublicUrl: ${TRYKATCH_PUBLIC_URL}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://otel-collector:4318}
      OTEL_EXPORTER_OTLP_PROTOCOL: ${OTEL_EXPORTER_OTLP_PROTOCOL:-http/protobuf}
      OTEL_SERVICE_NAME: ${OTEL_SERVICE_NAME:-trykatch-app-slug-api}
      OTEL_RESOURCE_ATTRIBUTES: service.namespace=${OTEL_SERVICE_NAMESPACE:-trykatch},service.version=${TRYKATCH_RELEASE_VERSION:?set an immutable release identifier},deployment.environment.name=${OTEL_DEPLOYMENT_ENVIRONMENT:-production}
      OTEL_TRACES_SAMPLER: parentbased_traceidratio
      OTEL_TRACES_SAMPLER_ARG: ${OTEL_TRACES_SAMPLER_ARG:-0.10}
      OpenIddict__SigningCertificate__Path: /run/secrets/signing.pfx
      OpenIddict__SigningCertificate__PasswordFile: /run/secrets/signing.password
      OpenIddict__EncryptionCertificate__Path: /run/secrets/encryption.pfx
      OpenIddict__EncryptionCertificate__PasswordFile: /run/secrets/encryption.password
      DataProtection__Certificate__Path: /run/secrets/data-protection.pfx
      DataProtection__Certificate__PasswordFile: /run/secrets/data-protection.password
      #if (email)
      Email__Host: ${TRYKATCH_SMTP_HOST:-}
      Email__Port: ${TRYKATCH_SMTP_PORT:-587}
      Email__From: ${TRYKATCH_SMTP_FROM:-}
      Email__Security: ${TRYKATCH_SMTP_SECURITY:-StartTls}
      Email__Username: ${TRYKATCH_SMTP_USERNAME:-}
      Email__PasswordFile: ${TRYKATCH_SMTP_PASSWORD_FILE:-}
      #endif
      Bootstrap__PlatformAdminEmail: ${TRYKATCH_BOOTSTRAP_ADMIN_EMAIL:-}
      Bootstrap__PlatformAdminPassword: ${TRYKATCH_BOOTSTRAP_ADMIN_PASSWORD:-}
      ReverseProxy__KnownProxies__0: ${TRYKATCH_WEB_PROXY_IP:-172.30.250.10}
    depends_on:
      migrator:
        condition: service_completed_successfully
    read_only: true
    tmpfs: [/tmp]
    volumes:
      - ${TRYKATCH_SECRETS_PATH:-./secrets}/signing.pfx:/run/secrets/signing.pfx:ro
      - ${TRYKATCH_SECRETS_PATH:-./secrets}/encryption.pfx:/run/secrets/encryption.pfx:ro
      - ${TRYKATCH_SECRETS_PATH:-./secrets}/signing.password:/run/secrets/signing.password:ro
      - ${TRYKATCH_SECRETS_PATH:-./secrets}/encryption.password:/run/secrets/encryption.password:ro
      - ${TRYKATCH_SECRETS_PATH:-./secrets}/data-protection.pfx:/run/secrets/data-protection.pfx:ro
      - ${TRYKATCH_SECRETS_PATH:-./secrets}/data-protection.password:/run/secrets/data-protection.password:ro
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    restart: unless-stopped
    stop_grace_period: 30s
    deploy:
      resources:
        limits: { cpus: "2.0", memory: 1G }

  web:
    logging: *bounded-logging
    build:
      context: .
      dockerfile: web/apps/web/Dockerfile
    environment:
      TRYKATCH_INGRESS_PROXY_IP: ${TRYKATCH_INGRESS_PROXY_IP:-172.30.250.2}
    ports: ["${TRYKATCH_WEB_BIND_ADDRESS:-127.0.0.1}:8080:8080"]
    networks:
      default:
        ipv4_address: ${TRYKATCH_WEB_PROXY_IP:-172.30.250.10}
    depends_on:
      api:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp
      - /var/cache/nginx
      - /var/run
      - /etc/nginx/conf.d:mode=0770,uid=101,gid=101
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    restart: unless-stopped
    stop_grace_period: 15s
    deploy:
      resources:
        limits: { cpus: "0.5", memory: 128M }

  postgres:
    logging: *bounded-logging
    image: postgres:18.6-alpine3.23@sha256:697c180dbf244d3ce4a8f4cbc0156cde840af055c1bf8b76aebe422a4822086f
    user: postgres
    environment:
      POSTGRES_DB: trykatch
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${TRYKATCH_POSTGRES_ADMIN_PASSWORD:?set the PostgreSQL administrator password}
      TRYKATCH_MIGRATOR_PASSWORD: ${TRYKATCH_MIGRATOR_PASSWORD:?set the migrator database password}
      TRYKATCH_ORG_RUNTIME_PASSWORD: ${TRYKATCH_ORG_RUNTIME_PASSWORD:?set the organization runtime database password}
      TRYKATCH_PLATFORM_RUNTIME_PASSWORD: ${TRYKATCH_PLATFORM_RUNTIME_PASSWORD:?set the platform runtime database password}
      TRYKATCH_IDENTITY_RUNTIME_PASSWORD: ${TRYKATCH_IDENTITY_RUNTIME_PASSWORD:?set the identity runtime database password}
      TRYKATCH_OUTBOX_WORKER_PASSWORD: ${TRYKATCH_OUTBOX_WORKER_PASSWORD:?set the outbox worker database password}
    volumes: [postgres-data:/var/lib/postgresql, ./deploy/postgres/init:/docker-entrypoint-initdb.d:ro]
    read_only: true
    tmpfs: [/tmp, /var/run/postgresql]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U postgres -d trykatch"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    stop_grace_period: 60s
    deploy:
      resources:
        limits: { cpus: "2.0", memory: 2G }

  otel-collector:
    logging: *bounded-logging
    build:
      context: ./deploy/observability
      dockerfile: otel-collector.Dockerfile
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    volumes: ["./deploy/observability/otel-collector.yml:/etc/otelcol-contrib/config.yaml:ro", collector-storage:/var/lib/otelcol]
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    restart: unless-stopped
    stop_grace_period: 30s
    deploy:
      resources:
        limits: { cpus: "1.0", memory: 512M }

  prometheus:
    logging: *bounded-logging
    image: prom/prometheus:v3.14.0@sha256:5ce7540c3c00ef4ab0c9d2c995c6a5b9c421f44b4a115d97a2c7af3b1c21cbb0
    volumes: ["./deploy/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro", prometheus-data:/prometheus]
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.path=/prometheus", "--storage.tsdb.retention.time=15d", "--storage.tsdb.retention.size=5GB"]
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    restart: unless-stopped
    deploy:
      resources:
        limits: { cpus: "1.0", memory: 1G }

  loki:
    logging: *bounded-logging
    image: grafana/loki:3.7.2@sha256:191d4fdfb7264f16989f0a57f320872620a5a7c2ceeec6229212c4190ec49b86
    command: ["-config.file=/etc/loki/local-config.yaml"]
    volumes: ["./deploy/observability/loki.yml:/etc/loki/local-config.yaml:ro", loki-data:/loki]
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    restart: unless-stopped
    deploy:
      resources:
        limits: { cpus: "1.0", memory: 1G }

  tempo:
    logging: *bounded-logging
    image: grafana/tempo:3.0.2@sha256:cda87c212d8c584dc0b89e337e7ed648a5100feb657e5d528480ee4fa03dbbe3
    command: ["-config.file=/etc/tempo.yml"]
    volumes: ["./deploy/observability/tempo.yml:/etc/tempo.yml:ro", tempo-data:/var/tempo]
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    restart: unless-stopped
    deploy:
      resources:
        limits: { cpus: "1.0", memory: 1G }

  grafana:
    logging: *bounded-logging
    image: grafana/grafana:13.2.1@sha256:f772d434e8fab0049deb2b1b30abd43342bcfca1537614aa8d36080232cf4283
    ports: ["${GRAFANA_BIND_ADDRESS:-127.0.0.1}:3000:3000"]
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes: ["./deploy/observability/grafana:/etc/grafana/provisioning:ro", grafana-data:/var/lib/grafana]
    depends_on: [prometheus, loki, tempo]
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    restart: unless-stopped
    deploy:
      resources:
        limits: { cpus: "1.0", memory: 512M }

volumes:
  postgres-data:
  prometheus-data:
  loki-data:
  tempo-data:
  grafana-data:
  collector-storage:

networks:
  default:
    ipam:
      config:
        - subnet: ${TRYKATCH_NETWORK_SUBNET:-172.30.250.0/24}
          ip_range: ${TRYKATCH_NETWORK_DYNAMIC_RANGE:-172.30.250.128/25}
          gateway: ${TRYKATCH_NETWORK_GATEWAY:-172.30.250.1}
