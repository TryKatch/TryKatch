name: web-ci

on:
  pull_request:
  push:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  verify-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: '**/packages.lock.json'
      - uses: pnpm/action-setup@v4
        with:
          version: 10.17.1
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: dotnet restore FlatpackApp.slnx
      - run: dotnet build src/FlatpackApp.Api/FlatpackApp.Api.csproj -c Release --no-restore
      - run: pnpm --dir web install --frozen-lockfile
      - run: pnpm --dir web generate
      - run: pnpm --dir web generate:check
      - run: git diff --exit-code -- web/packages/api-client/openapi web/packages/api-client/src/generated docs/generated/assistant-contract.json
      - run: pnpm --dir web typecheck
      - run: pnpm --dir web test
      - run: pnpm --dir web build
      - run: pnpm --dir web --filter @flatpackapp/web exec playwright install --with-deps chromium
      - run: pnpm --dir web --filter @flatpackapp/web test:e2e
      - run: pnpm --dir web audit --audit-level high
      - run: docker build -f web/apps/web/Dockerfile .
