name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
          cache: true
      - run: dotnet tool restore
      - run: dotnet restore FlatpackApp.slnx
      - run: dotnet build FlatpackApp.slnx -c Release --no-restore
      - run: dotnet test tests/FlatpackApp.UnitTests -c Release --no-build
      - run: dotnet test tests/FlatpackApp.IntegrationTests -c Release --no-build
      - run: dotnet list FlatpackApp.slnx package --vulnerable --include-transitive
      - run: docker compose config --quiet
      - run: docker build -f src/FlatpackApp.Api/Dockerfile .
      - uses: anchore/sbom-action@v0.24.0
        with:
          path: .
          format: spdx-json
          output-file: flatpack.spdx.json
      - uses: actions/upload-artifact@v4
        with:
          name: flatpack-sbom
          path: flatpack.spdx.json
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
