name: flatpack-app-slug

services:
  migrator:
    build:
      context: .
      dockerfile: src/FlatpackApp.Migrator/Dockerfile
    environment:
      ConnectionStrings__flatpackdb: ${FLATPACK_MIGRATOR_CONNECTION}
      Database__RuntimeRole: flatpack_runtime
      Database__RuntimePassword: ${FLATPACK_RUNTIME_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]

  api:
    build:
      context: .
      dockerfile: src/FlatpackApp.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__flatpackdb: ${FLATPACK_RUNTIME_CONNECTION}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
    depends_on:
      migrator:
        condition: service_completed_successfully
      otel-collector:
        condition: service_started
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]

  web:
    build:
      context: .
      dockerfile: web/apps/web/Dockerfile
    ports: ["8080:8080"]
    depends_on:
      api:
        condition: service_healthy
    read_only: true
    tmpfs: [/tmp, /var/cache/nginx, /var/run]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]

  postgres:
    image: postgres:18.0-alpine3.22
    environment:
      POSTGRES_DB: flatpack
      POSTGRES_USER: flatpack_migrator
      POSTGRES_PASSWORD: ${FLATPACK_MIGRATOR_PASSWORD}
    volumes: [postgres-data:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U flatpack_migrator -d flatpack"]
      interval: 5s
      timeout: 3s
      retries: 20

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.160.0
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    volumes: ["./deploy/observability/otel-collector.yml:/etc/otelcol-contrib/config.yaml:ro"]
    depends_on: [loki, tempo]

  prometheus:
    image: prom/prometheus:v3.14.0
    volumes: ["./deploy/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro", prometheus-data:/prometheus]

  loki:
    image: grafana/loki:3.7.2
    command: ["-config.file=/etc/loki/local-config.yaml"]
    volumes: ["./deploy/observability/loki.yml:/etc/loki/local-config.yaml:ro", loki-data:/loki]

  tempo:
    image: grafana/tempo:3.0.2
    command: ["-config.file=/etc/tempo.yml"]
    volumes: ["./deploy/observability/tempo.yml:/etc/tempo.yml:ro", tempo-data:/var/tempo]

  grafana:
    image: grafana/grafana:13.2.1
    ports: ["3000:3000"]
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
    volumes: ["./deploy/observability/grafana:/etc/grafana/provisioning:ro", grafana-data:/var/lib/grafana]
    depends_on: [prometheus, loki, tempo]

volumes:
  postgres-data:
  prometheus-data:
  loki-data:
  tempo-data:
  grafana-data:
