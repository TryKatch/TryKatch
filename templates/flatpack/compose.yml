name: flatpack-app-slug

services:
  migrator:
    build:
      context: .
      dockerfile: src/FlatpackApp.Migrator/Dockerfile
    environment:
      ConnectionStrings__flatpackdb: ${FLATPACK_MIGRATOR_CONNECTION}
      Database__RuntimeRole: flatpack_runtime
      Database__RuntimePassword: ${FLATPACK_RUNTIME_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    restart: "no"
    deploy:
      resources:
        limits: { cpus: "1.0", memory: 512M }

  api:
    build:
      context: .
      dockerfile: src/FlatpackApp.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__flatpackdb: ${FLATPACK_RUNTIME_CONNECTION}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
      OTEL_SERVICE_NAME: flatpack-app-slug-api
      OpenIddict__SigningCertificate__Path: /run/secrets/signing.pfx
      OpenIddict__SigningCertificate__Password: ${FLATPACK_SIGNING_CERTIFICATE_PASSWORD}
      OpenIddict__EncryptionCertificate__Path: /run/secrets/encryption.pfx
      OpenIddict__EncryptionCertificate__Password: ${FLATPACK_ENCRYPTION_CERTIFICATE_PASSWORD}
      Bootstrap__PlatformAdminEmail: ${FLATPACK_BOOTSTRAP_ADMIN_EMAIL:-}
      Bootstrap__PlatformAdminPassword: ${FLATPACK_BOOTSTRAP_ADMIN_PASSWORD:-}
    depends_on:
      migrator:
        condition: service_completed_successfully
      otel-collector:
        condition: service_started
    read_only: true
    tmpfs: [/tmp]
    volumes:
      - ${FLATPACK_SECRETS_PATH:-./secrets}/signing.pfx:/run/secrets/signing.pfx:ro
      - ${FLATPACK_SECRETS_PATH:-./secrets}/encryption.pfx:/run/secrets/encryption.pfx:ro
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    restart: unless-stopped
    stop_grace_period: 30s
    deploy:
      resources:
        limits: { cpus: "2.0", memory: 1G }

  web:
    build:
      context: .
      dockerfile: web/apps/web/Dockerfile
    ports: ["8080:8080"]
    depends_on:
      api:
        condition: service_healthy
    read_only: true
    tmpfs: [/tmp, /var/cache/nginx, /var/run]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    restart: unless-stopped
    stop_grace_period: 15s
    deploy:
      resources:
        limits: { cpus: "0.5", memory: 128M }

  postgres:
    image: postgres:18.6-alpine3.23@sha256:697c180dbf244d3ce4a8f4cbc0156cde840af055c1bf8b76aebe422a4822086f
    user: postgres
    environment:
      POSTGRES_DB: flatpack
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${FLATPACK_POSTGRES_ADMIN_PASSWORD}
      FLATPACK_MIGRATOR_PASSWORD: ${FLATPACK_MIGRATOR_PASSWORD}
    volumes: [postgres-data:/var/lib/postgresql, ./deploy/postgres/init:/docker-entrypoint-initdb.d:ro]
    read_only: true
    tmpfs: [/tmp, /var/run/postgresql]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U postgres -d flatpack"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    stop_grace_period: 60s
    deploy:
      resources:
        limits: { cpus: "2.0", memory: 2G }

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.160.0@sha256:799dc6cf12c96192af37b5bdba804da8c10b3bc563b43cb90c3f3c58d9572ad6
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    volumes: ["./deploy/observability/otel-collector.yml:/etc/otelcol-contrib/config.yaml:ro"]
    depends_on: [loki, tempo]
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    restart: unless-stopped
    deploy:
      resources:
        limits: { cpus: "1.0", memory: 512M }

  prometheus:
    image: prom/prometheus:v3.14.0@sha256:5ce7540c3c00ef4ab0c9d2c995c6a5b9c421f44b4a115d97a2c7af3b1c21cbb0
    volumes: ["./deploy/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro", prometheus-data:/prometheus]
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    restart: unless-stopped
    deploy:
      resources:
        limits: { cpus: "1.0", memory: 1G }

  loki:
    image: grafana/loki:3.7.2@sha256:191d4fdfb7264f16989f0a57f320872620a5a7c2ceeec6229212c4190ec49b86
    command: ["-config.file=/etc/loki/local-config.yaml"]
    volumes: ["./deploy/observability/loki.yml:/etc/loki/local-config.yaml:ro", loki-data:/loki]
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    restart: unless-stopped
    deploy:
      resources:
        limits: { cpus: "1.0", memory: 1G }

  tempo:
    image: grafana/tempo:3.0.2@sha256:cda87c212d8c584dc0b89e337e7ed648a5100feb657e5d528480ee4fa03dbbe3
    command: ["-config.file=/etc/tempo.yml"]
    volumes: ["./deploy/observability/tempo.yml:/etc/tempo.yml:ro", tempo-data:/var/tempo]
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    restart: unless-stopped
    deploy:
      resources:
        limits: { cpus: "1.0", memory: 1G }

  grafana:
    image: grafana/grafana:13.2.1@sha256:f772d434e8fab0049deb2b1b30abd43342bcfca1537614aa8d36080232cf4283
    ports: ["3000:3000"]
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
    volumes: ["./deploy/observability/grafana:/etc/grafana/provisioning:ro", grafana-data:/var/lib/grafana]
    depends_on: [prometheus, loki, tempo]
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    restart: unless-stopped
    deploy:
      resources:
        limits: { cpus: "1.0", memory: 512M }

volumes:
  postgres-data:
  prometheus-data:
  loki-data:
  tempo-data:
  grafana-data:
