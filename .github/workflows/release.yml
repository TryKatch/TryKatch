name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  nuget:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Verify release commit is on main
        run: |
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - run: bash scripts/test-template.sh
      - run: bash scripts/test-federation-module.sh
      - run: dotnet pack Flatpack.Templates.csproj -c Release -o artifacts/packages -p:PackageVersion=${GITHUB_REF_NAME#v}
      - run: dotnet pack templates/flatpack/tools/FlatpackApp.ModuleTool -c Release -o artifacts/packages -p:PackageVersion=${GITHUB_REF_NAME#v}
      - uses: anchore/sbom-action@v0.24.0
        with:
          path: templates/flatpack
          format: spdx-json
          output-file: artifacts/flatpack-template.spdx.json
      - uses: actions/upload-artifact@v4
        with:
          name: flatpack-release
          path: artifacts
      - run: dotnet nuget push "artifacts/packages/*.nupkg" --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
