name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write

jobs:
  nuget:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Verify release commit is on main
        run: |
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - run: bash scripts/test-template.sh
      - run: bash scripts/test-federation-module.sh
      - run: dotnet pack Trykatch.Templates.csproj -c Release -o artifacts/packages -p:PackageVersion=${GITHUB_REF_NAME#v}
      - run: dotnet pack templates/trykatch/tools/TrykatchApp.ModuleTool -c Release -o artifacts/packages -p:PackageVersion=${GITHUB_REF_NAME#v}
      - uses: anchore/sbom-action@v0.24.0
        with:
          path: templates/trykatch
          format: spdx-json
          output-file: artifacts/trykatch-template.spdx.json
      - uses: actions/upload-artifact@v4
        with:
          name: trykatch-release
          path: artifacts
      - name: Exchange GitHub identity for a temporary NuGet API key
        uses: NuGet/login@v1
        id: login
        with:
          user: sudi
      - name: Publish packages to NuGet.org
        run: dotnet nuget push "artifacts/packages/*.nupkg" --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate
