name: template-ci

on:
  pull_request:
  push:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: template-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-template:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: templates/flatpack/**/packages.lock.json
      - uses: pnpm/action-setup@v6
        with:
          version: 10.17.1
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: templates/flatpack/web/pnpm-lock.yaml
      # Aspire's AppHost lock contains an SDK-runtime-specific dashboard package.
      # A normal restore preserves the pinned graph while translating that one
      # package for the runner OS.
      - run: dotnet restore templates/flatpack/FlatpackApp.slnx
      - run: dotnet build templates/flatpack/FlatpackApp.slnx -c Release --no-restore
      - name: Validate full-stack module composition
        run: dotnet run --project templates/flatpack/tools/FlatpackApp.ModuleTool -c Release --no-build -- module doctor --root templates/flatpack
      - name: Verify Flatpack CLI package
        run: dotnet pack templates/flatpack/tools/FlatpackApp.ModuleTool -c Release --no-build -o artifacts/cli -p:PackageVersion=0.1.0-ci
      - run: dotnet test templates/flatpack/tests/FlatpackApp.UnitTests -c Release --no-build
      - run: dotnet test templates/flatpack/tests/FlatpackApp.IntegrationTests -c Release --no-build
      - run: pnpm --dir templates/flatpack/web install --frozen-lockfile
      - run: pnpm --dir templates/flatpack/web generate
      - run: git diff --exit-code -- templates/flatpack/web/packages/api-client/openapi templates/flatpack/web/packages/api-client/src/generated templates/flatpack/docs/generated/assistant-contract.json
      - run: pnpm --dir templates/flatpack/web typecheck
      - run: pnpm --dir templates/flatpack/web test
      - run: pnpm --dir templates/flatpack/web build
      - run: pnpm --dir templates/flatpack/web --filter @flatpackapp/web exec playwright install --with-deps chromium
      - run: pnpm --dir templates/flatpack/web --filter @flatpackapp/web test:e2e
      - run: dotnet list templates/flatpack/FlatpackApp.slnx package --vulnerable --include-transitive
      - run: pnpm --dir templates/flatpack/web audit --audit-level high
      - run: docker compose -f templates/flatpack/compose.yml config --quiet
      - run: docker build -f templates/flatpack/src/FlatpackApp.Api/Dockerfile templates/flatpack
      - run: docker build -f templates/flatpack/web/apps/web/Dockerfile templates/flatpack
      - run: bash scripts/test-migrator.sh
      - name: Reclaim ephemeral runner disk
        run: |
          docker system prune --all --force --volumes
          find templates/flatpack -type d \( -name bin -o -name obj -o -name node_modules -o -name dist \) -prune -exec rm -rf {} +
      - run: bash scripts/test-template.sh
      - uses: anchore/sbom-action@v0.24.0
        with:
          path: templates/flatpack
          format: spdx-json
          output-file: flatpack-template.spdx.json
      - uses: actions/upload-artifact@v4
        with:
          name: flatpack-template-sbom
          path: flatpack-template.spdx.json
      - name: Scan Git history for secrets
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_LINUX_X64_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          archive="$RUNNER_TEMP/gitleaks_linux_x64.tar.gz"
          curl --fail --location --silent --show-error \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            --output "$archive"
          echo "${GITLEAKS_LINUX_X64_SHA256}  ${archive}" | sha256sum --check
          tar --extract --gzip --file "$archive" --directory "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" git --redact --verbose .
