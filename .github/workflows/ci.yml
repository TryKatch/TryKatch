name: template-ci

on:
  pull_request:
  push:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: template-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-documentation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
        with:
          version: 10.17.1
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: docs-site/pnpm-lock.yaml
      - run: pnpm --dir docs-site install --frozen-lockfile
      - run: pnpm --dir docs-site build
      - run: pnpm --dir docs-site audit --audit-level high

  verify-template:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: templates/trykatch/**/packages.lock.json
      - uses: pnpm/action-setup@v6
        with:
          version: 10.17.1
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: templates/trykatch/web/pnpm-lock.yaml
      # Aspire's AppHost lock contains an SDK-runtime-specific dashboard package.
      # A normal restore preserves the pinned graph while translating that one
      # package for the runner OS.
      - run: dotnet restore templates/trykatch/TrykatchApp.slnx
      - run: dotnet build templates/trykatch/TrykatchApp.slnx -c Release --no-restore
      - name: Verify deployable .NET publish graphs
        run: |
          dotnet publish templates/trykatch/src/TrykatchApp.Api/TrykatchApp.Api.csproj -c Release --no-restore --no-build -o artifacts/publish/api
          dotnet publish templates/trykatch/src/TrykatchApp.Migrator/TrykatchApp.Migrator.csproj -c Release --no-restore --no-build -o artifacts/publish/migrator
      - name: Validate full-stack module composition
        run: dotnet run --project templates/trykatch/tools/TrykatchApp.ModuleTool -c Release --no-build -- module doctor --root templates/trykatch
      - name: Verify Trykatch CLI package
        run: dotnet pack templates/trykatch/tools/TrykatchApp.ModuleTool -c Release --no-build -o artifacts/cli -p:PackageVersion=0.1.0-ci
      - run: dotnet test templates/trykatch/tests/TrykatchApp.UnitTests -c Release --no-build
      - run: dotnet test templates/trykatch/tests/TrykatchApp.IntegrationTests -c Release --no-build
      - run: pnpm --dir templates/trykatch/web install --frozen-lockfile
      - name: Verify disabled and enabled Federation composition
        run: bash scripts/test-federation-module.sh
      - run: pnpm --dir templates/trykatch/web generate
      - run: git diff --exit-code -- templates/trykatch/web/packages/api-client/openapi templates/trykatch/web/packages/api-client/src/generated templates/trykatch/docs/generated/assistant-contract.json
      - run: pnpm --dir templates/trykatch/web typecheck
      - run: pnpm --dir templates/trykatch/web test
      - run: pnpm --dir templates/trykatch/web build
      - name: Exclude unrelated Google Chrome apt feed
        run: |
          for chrome_source in /etc/apt/sources.list.d/google-chrome.*; do
            if [[ -f "$chrome_source" ]]; then
              sudo mv "$chrome_source" "$RUNNER_TEMP/$(basename "$chrome_source").disabled"
            fi
          done
      - run: pnpm --dir templates/trykatch/web --filter @trykatchapp/web exec playwright install --with-deps chromium
      - run: pnpm --dir templates/trykatch/web --filter @trykatchapp/web test:e2e
      - run: dotnet list templates/trykatch/TrykatchApp.slnx package --vulnerable --include-transitive
      - run: pnpm --dir templates/trykatch/web audit --audit-level high
      - run: docker compose -f templates/trykatch/compose.yml config --quiet
      - run: docker build -f templates/trykatch/src/TrykatchApp.Api/Dockerfile templates/trykatch
      - run: docker build -f templates/trykatch/web/apps/web/Dockerfile templates/trykatch
      - run: bash scripts/test-migrator.sh
      - name: Reclaim ephemeral runner disk
        run: |
          docker system prune --all --force --volumes
          find templates/trykatch -type d \( -name bin -o -name obj -o -name node_modules -o -name dist \) -prune -exec rm -rf {} +
      - run: bash scripts/test-template.sh
      - uses: anchore/sbom-action@v0.24.0
        with:
          path: templates/trykatch
          format: spdx-json
          output-file: trykatch-template.spdx.json
      - uses: actions/upload-artifact@v4
        with:
          name: trykatch-template-sbom
          path: trykatch-template.spdx.json
      - name: Scan Git history for secrets
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_LINUX_X64_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          archive="$RUNNER_TEMP/gitleaks_linux_x64.tar.gz"
          curl --fail --location --silent --show-error \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            --output "$archive"
          echo "${GITLEAKS_LINUX_X64_SHA256}  ${archive}" | sha256sum --check
          tar --extract --gzip --file "$archive" --directory "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" git --redact --verbose .
